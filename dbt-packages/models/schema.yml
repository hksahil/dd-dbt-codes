version: 2

models:
  # ----------------------------------------------------
  # 1. dbt-utils Example Schema & Tests
  # ----------------------------------------------------
  - name: 01_dbt_utils
    description: "Demonstrates dbt-utils macros and compound key tests"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - user_id
    columns:
      - name: order_customer_surrogate_key
        tests:
          - unique
          - not_null

  # ----------------------------------------------------
  # 2. Great Expectations (dbt-expectations) Example Tests
  # ----------------------------------------------------
  - name: 02_great_expectations
    description: "Demonstrates advanced Great Expectations assertions"
    columns:
      - name: amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100000

      - name: status
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[a-z_]+$"

  # ----------------------------------------------------
  # 3. Elementary Observability & Anomaly Detection Tests
  # ----------------------------------------------------
  - name: 03_elementary
    description: "Demonstrates Elementary ML-driven automated data observability"
    # NOTE: Elementary's ML bucket macros ('complete_buckets_cte') are implemented
    # for cloud warehouses (Snowflake, BigQuery, Redshift, Databricks, Postgres).
    # In enterprise production on Snowflake/BigQuery, enable these:
    # tests:
    #   - elementary.volume_anomalies:
    #       arguments:
    #         timestamp_column: order_date
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: amount
        tests:
          - not_null
          # - elementary.column_anomalies:
          #     arguments:
          #       timestamp_column: order_date
